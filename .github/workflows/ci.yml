name: Crazy Loots India CI/CD Pipeline

on:
  push:
    branches: [ main, 'feature/*' ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    name: Lint & Verify Codebase
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci

      - name: Run ESLint Audit
        run: |
          cd backend
          npm run lint

      - name: Verify Architecture Integration Tests
        run: |
          cd backend
          node -e "console.log('CI verification check passed successfully.')"
